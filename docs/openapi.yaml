          in: query
          required: false
          schema:
            type: integer
            default: 1
      responses:
        '200':
          description: Daftar transaksi laboratorium
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        FS_KD_TRS:
                          type: string
                          example: "TRS-LAB-20261113-001"
                        FD_TGL_TRS:
                          type: string
                          format: date
                          example: "2026-11-13"
                        FS_JAM_TRS:
                          type: string
                          example: "09:30:00"

  /penunjang/laboratorium_detail:
    get:
      tags:
        - Penunjang & Rekam Medis
      summary: Rincian 5 Parameter Pemeriksaan Laboratorium
      description: Menampilkan rincian parameter hasil laboratorium (nama, hasil, satuan, nilai rujukan, dan flag H/L/N).
      parameters:
        - name: fs_kd_trs
          in: query
          required: true
          schema:
            type: string
          example: "TRS-LAB-20261113-001"
      responses:
        '200':
          description: Detail parameter laboratorium
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        pemeriksaan:
                          type: string
                          example: "Hemoglobin"
                        hasil:
                          type: string
                          example: "14.2"
                        satuan:
                          type: string
                          example: "g/dL"
                        nilai_rujukan:
                          type: string
                          example: "13.2 - 17.3"
                        flag:
                          type: string
                          enum: [H, L, N]
                          example: "N"

