  # ==========================================
  # TAG: NOTIFIKASI
  # ==========================================
  /user/fcm-token:
    post:
      tags:
        - Notifikasi (Fase 6 - Baru)
      summary: Daftarkan Device Token FCM Pasien
      description: Menautkan token perangkat Firebase Cloud Messaging dengan Rekam Medis pasien untuk push notification antrean & hasil penunjang.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - fs_mr
                - fcm_token
                - device_type
              properties:
                fs_mr:
                  type: string
                  example: "01-88-24-90"
                fcm_token:
                  type: string
                  example: "dG9rZW5fZmNtX2RldmljZV9leGFtcGxl..."
                device_type:
                  type: string
                  enum: [android, ios]
                  example: "android"
      responses:
        '200':
          description: Token FCM berhasil didaftarkan

